[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lusee_faraday"
version = "0.0.1"
description = "Simulator of LUSEE Faraday rotation observations."
readme = "README.md"
license = {text = "MIT"}
authors = [{ name="Christian Hellum Bye", email="cbh@berkeley.edu" }]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy",
  "scipy",
  "astropy",
  "healpy",
  "h5py",
  "lunarsky",
  "jupyterlab>=4.5.5",
  "ipympl>=0.10.0",
  "jupyterlab-vim>=4.1.4",
  "pytest>=8.4.2",
  "lusee",
  "croissant-sim",
  "finufft",
  "fitsio",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "black",
  "flake8",
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--junitxml=junit.xml",
  "-o junit_family=legacy",
]

[tool.black]
line-length = 79

[tool.uv.sources]
lusee = { path = "../luseepy", editable = true }
croissant-sim = { path = "/home/christian/Documents/projects/croissant-main", editable = true }

[tool.uv]
# luseepy main pins croissant-sim to a git rev; we deliberately use our
# local checkout, which is 6 commits ahead of that pin.
override-dependencies = [
  "croissant-sim",
]
